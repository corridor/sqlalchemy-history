[project]
site_name = "SQLAlchemy-History"
site_url = "https://corridor.github.io/sqlalchemy-history"
site_description = "History tracking extension for SQLAlchemy."
site_author = "Corridor Platforms"
copyright = """
  Copyright &copy; 2026
  <a href="https://corridorplatforms.com">Corridor Platforms</a>
"""
repo_url = "https://github.com/corridor/sqlalchemy-history"
repo_name = "sqlalchemy-history"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "User Guide" = [
    "version_objects.md",
    "revert.md",
    "queries.md",
    "transactions.md",
    "async.md",
    "plugins.md",
    "configuration.md",
    "schema.md",
    "alembic.md",
  ] },
  { "API Reference" = [
    "utilities.md",
    "api.md",
  ] },
  { "License" = "license.md" },
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
  "content.tooltips",
]

# Follow the operating-system color preference by default.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Allow users to select light mode explicitly.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Allow users to select dark mode explicitly, then return to system mode.
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/corridor/sqlalchemy-history"
name = "SQLAlchemy-History on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/sqlalchemy-history/"
name = "SQLAlchemy-History on PyPI"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
show_source = false
show_root_heading = true
