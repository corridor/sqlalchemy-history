# Triggered by a github release being created, builds and publishes the package to PyPI.

name: Publish

on:
  release:
    types:
      - created

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.13
          enable-cache: true

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        run: uv publish
