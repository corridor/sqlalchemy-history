# Triggered by a github release being created, builds and publishes the package to PyPI.

name: Publish

on:
  release:
    types:
      - created

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: 3.13
          enable-cache: true

      - name: Build distribution
        run: uv build

      - name: Generate PyPI attestations
        run: uvx pypi-attestations sign dist/*

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
